name: check

# Every PR into main, and main itself after a merge. This gate decides whether
# code is allowed to become a release candidate — it does not deploy anything.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR makes the previous run pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The identical command the Stop hook runs locally. If a check needs to
      # change it changes in check.mjs, never here, so the two cannot drift.
      - name: Quality gate
        run: node .claude/scripts/check.mjs --full

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Render builds this same Dockerfile. Building it here catches "works in
      # npm run dev, fails in the container" before a release is cut rather
      # than after — that has already happened once, via a stale tsbuildinfo
      # that made tsc emit nothing and exit 0.
      - name: Build the image Render will build
        run: docker build -t salesdoc-dialer:ci .

      - name: Boot it and check it serves
        run: |
          docker run -d --name ci -p 3000:3000 salesdoc-dialer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health
          # The frontend has silently stopped being served twice. A 200 on
          # /api/health does not prove the page renders.
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          asset=$(curl -fsS http://localhost:3000/ | grep -o '/assets/[^"]*\.js' | head -1)
          # An asset answering with index.html is the exact failure mode that
          # shipped before: a 200 that renders a blank page. Negate the whole
          # grep — `grep -qv` would pass on any bundle with one non-matching
          # line, which is every bundle, so it could never fail.
          if curl -fsS "http://localhost:3000$asset" | grep -q '<div id="root">'; then
            echo "::error::$asset served index.html instead of JavaScript."
            exit 1
          fi
          docker rm -f ci
