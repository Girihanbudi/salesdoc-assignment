services:
  - type: web
    name: salesdoc-dialer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    # Off: releases are cut by tagging, and .github/workflows/release.yml fires
    # the deploy hook after re-running the gate on the tagged commit. Leaving
    # this on would deploy every merge to main, which makes the tag meaningless
    # and the gate decorative.
    #
    # This service was created through the dashboard, so Render ignores this
    # file — the same setting has to be turned off under
    # Settings -> Build & Deploy -> Auto-Deploy.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
