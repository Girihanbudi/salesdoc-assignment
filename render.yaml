services:
  - type: web
    name: salesdoc-dialer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    # On until CI exists. Once the workflow on the ci branch lands, turn this
    # off and let it fire the deploy hook instead — otherwise Render deploys
    # every push in parallel with the gate, and the gate decides nothing.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
